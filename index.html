<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplan Abendessen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f2ec;--surface:#fff;--surface2:#f0ede6;
  --accent:#2d6a4f;--accent-light:#d8f0e6;
  --text:#1a1a18;--text2:#5a5a55;--text3:#9a9a94;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --radius:14px;--radius-sm:8px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text{font-family:'DM Serif Display',serif;font-size:20px}
.header-right{display:flex;align-items:center;gap:10px}
.suggest-all-btn{display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s}
.suggest-all-btn:hover{opacity:.88}
.suggest-all-btn:disabled{opacity:.5;cursor:not-allowed}
.spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);width:34px;height:34px;cursor:pointer;font-size:18px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:background .15s}
.week-nav button:hover{background:#e4e0d8}
.week-label{font-size:13px;color:var(--text2);min-width:130px;text-align:center;font-weight:500}

/* MAIN */
.main{max-width:800px;margin:0 auto;padding:2rem 1.5rem}
.week-header{margin-bottom:1.5rem;display:flex;align-items:baseline;gap:12px}
.week-header h2{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400}
.week-header span{font-size:13px;color:var(--text3)}
.days-list{display:flex;flex-direction:column;gap:12px}

/* PERSONS BAR */
.persons-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.persons-bar label{font-size:13px;color:var(--text2);font-weight:500;margin-right:4px}
.person-tags{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.person-tag{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);font-size:12px;background:var(--surface2)}
.person-tag .dot{width:8px;height:8px;border-radius:50%}
.add-person-form{display:flex;gap:6px}
.add-person-form input{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:5px 10px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);width:110px}
.add-person-form input:focus{outline:none;border-color:var(--accent)}
.add-person-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:5px 10px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.remove-person-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;line-height:1;padding:0}

/* DAY CARD */
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:slideIn .3s ease both}
.day-card.today{border-color:var(--accent);border-width:1.5px}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.day-head{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--surface2);border-bottom:1px solid var(--border)}
.day-card.today .day-head{background:var(--accent-light)}
.day-num{font-family:'DM Serif Display',serif;font-size:32px;line-height:1;min-width:40px}
.day-card.today .day-num{color:var(--accent)}
.day-name{font-size:15px;font-weight:500}
.day-date-full{font-size:12px;color:var(--text3);margin-top:1px}
.today-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:500;padding:3px 11px;border-radius:20px}
.day-head-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.day-suggest-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:5px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .12s}
.day-suggest-btn:hover{background:var(--surface)}
.day-suggest-btn:disabled{opacity:.4;cursor:not-allowed}
.mini-spin{width:11px;height:11px;border:1.5px solid rgba(0,0,0,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* DINNER CELL */
.dinner-cell{padding:16px 20px;cursor:pointer;transition:background .12s;min-height:72px}
.dinner-cell:hover{background:#fafaf8}
.dinner-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:500;margin-bottom:6px}
.dinner-content{display:flex;align-items:center;gap:10px}
.dinner-emoji{font-size:22px;line-height:1}
.dinner-info{flex:1}
.dinner-name{font-size:14px;font-weight:500;color:var(--text)}
.dinner-person{font-size:12px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:4px}
.dinner-person .pdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dinner-empty{font-size:13px;color:var(--text3);display:flex;align-items:center;gap:5px}
.del-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0;line-height:1}
.del-btn:hover{color:var(--text2)}

.ai-suggestion{margin-top:6px;display:flex;align-items:center;gap:6px}
.ai-chip{font-size:11px;color:var(--accent);background:var(--accent-light);padding:2px 8px;border-radius:20px;display:flex;align-items:center;gap:4px;max-width:160px;overflow:hidden}
.ai-chip-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-accept-btn{font-size:11px;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:4px;padding:1px 7px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .1s;white-space:nowrap}
.ai-accept-btn:hover{background:var(--accent);color:#fff}
.loading-chip{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px;margin-top:6px}

/* ===== MODALS ===== */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}

/* Picker modal */
.picker{background:var(--surface);border-radius:var(--radius);width:380px;max-width:95vw;padding:20px;border:1px solid var(--border);animation:popIn .18s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h3{font-size:15px;font-weight:500}
.modal-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text3);line-height:1}
.search-box{width:100%;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--surface2);margin-bottom:10px}
.search-box:focus{outline:none;border-color:var(--accent)}
.recipe-list{display:flex;flex-direction:column;gap:5px;max-height:320px;overflow-y:auto}
.recipe-list::-webkit-scrollbar{width:4px}
.recipe-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.recipe-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;cursor:pointer;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:background .1s}
.recipe-btn:hover{background:var(--surface2);border-color:var(--border2)}
.recipe-btn .em{font-size:20px}
.recipe-btn .rname{font-size:13px;color:var(--text);flex:1}
.recipe-btn .arr{font-size:15px;color:var(--text3)}

/* Detail modal */
.detail-modal{background:var(--surface);border-radius:var(--radius);width:440px;max-width:96vw;max-height:88vh;overflow-y:auto;border:1px solid var(--border);animation:popIn .18s ease}
.detail-modal::-webkit-scrollbar{width:4px}
.detail-modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.detail-hero{padding:24px 24px 16px;border-bottom:1px solid var(--border)}
.detail-emoji{font-size:40px;margin-bottom:10px}
.detail-title{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;margin-bottom:4px}
.detail-meta{font-size:12px;color:var(--text3)}
.detail-body{padding:20px 24px}
.detail-section{margin-bottom:20px}
.detail-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:500;margin-bottom:10px}
.ingredient-list{display:flex;flex-direction:column;gap:5px}
.ingredient-item{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 10px;background:var(--surface2);border-radius:var(--radius-sm)}
.ingredient-item .ing-emoji{font-size:16px;width:22px;text-align:center}
.ingredient-item .ing-name{flex:1;color:var(--text)}
.ingredient-item .ing-amount{color:var(--text3);font-size:12px}
.person-select{display:flex;flex-wrap:wrap;gap:8px}
.person-option{display:flex;align-items:center;gap:7px;padding:8px 14px;border:1.5px solid var(--border2);border-radius:20px;cursor:pointer;font-size:13px;background:none;font-family:'DM Sans',sans-serif;color:var(--text);transition:all .12s}
.person-option:hover{background:var(--surface2)}
.person-option.selected{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:500}
.person-option .pdot{width:9px;height:9px;border-radius:50%}
.no-person-opt{font-size:13px;color:var(--text3);padding:8px 14px;border:1.5px dashed var(--border2);border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;background:none;transition:all .12s}
.no-person-opt:hover{background:var(--surface2)}
.no-person-opt.selected{border-color:var(--text3);color:var(--text2)}
.detail-actions{display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}
.btn-primary{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-secondary:hover{background:var(--surface2)}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:600px){
  header{padding:0 1rem;height:auto;flex-wrap:wrap;gap:6px;padding:10px 1rem}
  .main{padding:1rem}
  .suggest-all-btn span:last-child{display:none}
}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--accent);background:none;color:var(--accent);font-size:11px;font-weight:700;cursor:pointer;line-height:1;margin-left:4px;flex-shrink:0;transition:all .12s;vertical-align:middle}
.info-btn:hover{background:var(--accent);color:#fff}
.prep-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:12px 0 6px;border-top:1px solid var(--border);margin-top:8px;user-select:none}
.prep-toggle h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:500}
.prep-arrow{font-size:12px;color:var(--text3);transition:transform .2s;display:inline-block;margin-left:6px}
.prep-arrow.open{transform:rotate(180deg)}
.prep-loading{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text3);padding:8px 0}
.prep-steps{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.prep-step{display:flex;gap:10px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.add-custom-btn{width:100%;margin-top:10px;padding:9px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);background:none;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .12s}
.add-custom-btn:hover{background:var(--accent-light)}
.custom-field{display:flex;flex-direction:column;gap:4px}
.custom-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:500}
.custom-badge{font-size:10px;background:var(--accent-light);color:var(--accent);padding:1px 6px;border-radius:10px;font-weight:500;margin-left:5px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🍽️</div>
    <span class="logo-text">Abendessen-Plan</span>
  </div>
  <div class="header-right">
    <button class="suggest-all-btn" id="suggestAllBtn" onclick="suggestAll()">
      <span>✨</span><span> Woche vorschlagen</span>
    </button>
    <span id="syncDot" title="Wird synchronisiert…" style="width:8px;height:8px;border-radius:50%;background:#f4a261;opacity:0;transition:opacity .3s;flex-shrink:0"></span>    <div class="week-nav">
      <button onclick="shiftWeek(-1)">&#8249;</button>
      <span class="week-label" id="weekLabel"></span>
      <button onclick="shiftWeek(1)">&#8250;</button>
    </div>
  </div>
</header>

<main class="main">
  <div class="week-header">
    <h2 id="weekTitle">Diese Woche</h2>
    <span id="weekRange"></span>
  </div>

  <!-- Persons -->
  <div class="persons-bar">
    <label>Personen:</label>
    <div class="person-tags" id="personTags"></div>
    <div class="add-person-form">
      <input type="text" id="newPersonInput" placeholder="Name…" maxlength="18" onkeydown="if(event.key==='Enter')addPerson()">
      <button class="add-person-btn" onclick="addPerson()">+ Hinzufügen</button>
    </div>
  </div>

  <div class="days-list" id="daysList"></div>
</main>

<!-- Picker overlay -->
<div class="overlay" id="pickerOverlay" onclick="overlayClick(event,'pickerOverlay')">
  <div class="picker" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="pickerTitle">Gericht wählen</h3>
      <button class="modal-close" onclick="closePicker()">&#215;</button>
    </div>
    <input class="search-box" id="searchBox" placeholder="Suchen…" oninput="renderPickerList()">
    <div class="recipe-list" id="recipeList"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="add-custom-btn" style="flex:1" onclick="openCustomRecipe(null)">+ Eigenes Gericht erstellen</button>
      <button class="add-custom-btn" style="flex:1;color:var(--text2)" onclick="openManageCustom()">✏️ Eigene verwalten</button>
    </div>
  </div>
</div>

<!-- Custom Recipe overlay -->
<div class="overlay" id="customOverlay" onclick="overlayClick(event,'customOverlay')">
  <div class="picker" style="max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="customTitle">Eigenes Gericht</h3>
      <button class="modal-close" onclick="closeCustomRecipe()">&#215;</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="custom-field">
        <label class="custom-label">Name *</label>
        <input class="search-box" id="cName" placeholder="z.B. Omas Gulasch" style="margin-bottom:0">
      </div>
      <div class="custom-field">
        <label class="custom-label">Emoji</label>
        <input class="search-box" id="cEmoji" placeholder="🍽️" maxlength="2" style="margin-bottom:0;width:70px">
      </div>
      <div class="custom-field">
        <label class="custom-label">Zubereitungszeit (Min)</label>
        <input class="search-box" id="cTime" type="number" placeholder="45" style="margin-bottom:0;width:100px">
      </div>
      <div class="custom-field">
        <label class="custom-label">Kategorie-Tags (kommagetrennt)</label>
        <input class="search-box" id="cTags" placeholder="Fleisch, Klassisch" style="margin-bottom:0">
      </div>
      <div class="custom-field">
        <label class="custom-label">Zutaten (eine pro Zeile, Format: Menge; Name)</label>
        <textarea class="search-box" id="cIngredients" rows="5" placeholder="500 g; Hackfleisch&#10;2 Stück; Zwiebeln&#10;3 Zehen; Knoblauch" style="margin-bottom:0;resize:vertical;font-family:inherit"></textarea>
      </div>
      <div class="custom-field">
        <label class="custom-label">Zubereitung (eine pro Zeile)</label>
        <textarea class="search-box" id="cSteps" rows="5" placeholder="Zwiebeln hacken und anbraten.&#10;Hackfleisch dazugeben.&#10;Würzen und servieren." style="margin-bottom:0;resize:vertical;font-family:inherit"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn-secondary" onclick="closeCustomRecipe()">Abbrechen</button>
        <button class="btn-primary" onclick="saveCustomRecipe()">Gericht speichern</button>
      </div>
    </div>
  </div>
</div>

<!-- Manage Custom Recipes overlay -->
<div class="overlay" id="manageOverlay" onclick="overlayClick(event,'manageOverlay')">
  <div class="picker" style="max-height:85vh;overflow-y:auto" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3>Eigene Gerichte verwalten</h3>
      <button class="modal-close" onclick="closeManageCustom()">&#215;</button>
    </div>
    <div id="manageList"></div>
  </div>
</div>

<!-- Detail overlay -->
<div class="overlay" id="detailOverlay" onclick="overlayClick(event,'detailOverlay')">
  <div class="detail-modal" onclick="event.stopPropagation()">
    <div class="detail-hero">
      <div class="detail-emoji" id="dEmoji"></div>
      <div class="detail-title" id="dTitle"></div>
      <div class="detail-meta" id="dMeta"></div>
    </div>
    <div class="detail-body">
      <div class="detail-section">
        <h4>Zutaten (4 Personen)</h4>
        <div class="ingredient-list" id="dIngredients"></div>
      </div>
      <div class="detail-section">
        <h4>Zuständige Person</h4>
        <div class="person-select" id="dPersonSelect"></div>
      </div>
      <div class="detail-section" style="padding-bottom:0">
        <div class="prep-toggle" id="prepToggle" onclick="togglePrep()">
          <h4>🍳 Zubereitung <span class="prep-arrow" id="prepArrow">▼</span></h4>
        </div>
        <div id="prepBody"></div>
      </div>
    </div>
    <div class="detail-actions">
      <button class="btn-secondary" onclick="closeDetail()">Schließen</button>
      <button class="btn-primary" onclick="saveDetail()">Speichern ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== DATA ===================== */
const WEEKDAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const PERSON_COLORS = ['#e76f51','#2a9d8f','#e9c46a','#6a67ce','#f4a261','#264653','#e63946','#43aa8b'];

const RECIPES = [
  {id:1,name:'Spaghetti Bolognese',em:'🍝',time:40,tags:['Pasta','Fleisch'],ingredients:[
    {em:'🍝',name:'Spaghetti',amount:'400 g'},{em:'🥩',name:'Hackfleisch',amount:'500 g'},
    {em:'🧅',name:'Zwiebel',amount:'2 Stück'},{em:'🧄',name:'Knoblauch',amount:'3 Zehen'},
    {em:'🍅',name:'Tomaten (Dose)',amount:'2 × 400 g'},{em:'🫒',name:'Olivenöl',amount:'3 EL'},
    {em:'🌿',name:'Basilikum',amount:'1 Bund'},{em:'🧀',name:'Parmesan',amount:'60 g'}
  ]},
  {id:2,name:'Hähnchen Curry',em:'🍛',time:35,tags:['Geflügel','Asiatisch'],ingredients:[
    {em:'🍗',name:'Hähnchenbrust',amount:'600 g'},{em:'🥛',name:'Kokosmilch',amount:'400 ml'},
    {em:'🫑',name:'Paprika',amount:'2 Stück'},{em:'🧅',name:'Zwiebel',amount:'1 Stück'},
    {em:'🧄',name:'Knoblauch',amount:'2 Zehen'},{em:'🫙',name:'Curry-Paste',amount:'2 EL'},
    {em:'🍚',name:'Basmati-Reis',amount:'300 g'},{em:'🌿',name:'Koriander',amount:'½ Bund'}
  ]},
  {id:3,name:'Grillsteak & Gemüse',em:'🥩',time:25,tags:['Fleisch','Grill'],ingredients:[

  mon.setDate(now.getDate() + (day===0?-6:1-day) + offset*7);
  mon.setHours(0,0,0,0); return mon;
}
function getWeekDays(offset) {
  const mon = getMonday(offset);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function isToday(d) { const t=new Date(); return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear(); }
function dateKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function getKW(d) {
  const jan4=new Date(d.getFullYear(),0,4), w1=new Date(jan4);
  w1.setDate(jan4.getDate()-(jan4.getDay()||7)+1);
  return Math.ceil(((d-w1)/86400000+1)/7);
}

    // Dinner cell
    const cell = document.createElement('div');

/* ===================== SMART SUGGESTIONS (kein API) ===================== */
function smartSuggest(items) {
  // Alle bereits geplanten oder vorgeschlagenen IDs sammeln
  const usedIds = new Set([
    ...Object.values(plan).map(e => e.recipeId),
    ...Object.values(suggestions).filter(s => s !== 'loading').map(s => s.id),
  ]);

  // Tags der bereits geplanten Gerichte (für Abwechslung)
  const recentTags = Object.values(plan)
    .map(e => { const r = RECIPES.find(x => x.id === e.recipeId); return r ? r.tags : []; })
    .flat();

  const result = [];

  items.forEach(item => {
    // Kandidaten: nicht bereits genutzt
    let candidates = RECIPES.filter(r => !usedIds.has(r.id));

    // Bevorzuge Gerichte deren Tags noch nicht kürzlich vorkamen
    const preferred = candidates.filter(r => !r.tags.some(t => recentTags.includes(t)));
    if (preferred.length > 0) candidates = preferred;

    // Zufällig aus den Kandidaten wählen
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    if (pick) {
      suggestions[item.key] = pick;
      usedIds.add(pick.id);
      pick.tags.forEach(t => recentTags.push(t));
      result.push(pick);
    }
  });

  return result;
}

function suggestDay(key, di) {
  const days = getWeekDays(weekOffset);
  const d = days[di];
  if (plan[key]) { showToast('Tag bereits geplant'); return; }
  smartSuggest([{ key, dayName: WEEKDAYS[d.getDay()] }]);
  render();
}

function suggestAll() {
  const days = getWeekDays(weekOffset);
  const items = days
    .map(d => ({ key: dateKey(d), dayName: WEEKDAYS[d.getDay()] }))
    .filter(x => !plan[x.key]);
  if (!items.length) { showToast('Alle Tage bereits geplant'); return; }
  smartSuggest(items);
  render();
  showToast('Vorschläge bereit – ✓ zum Übernehmen klicken');
}

function saveCustomRecipe() {
  const name = document.getElementById('cName').value.trim();
  if (!name) { showToast('Bitte einen Namen eingeben'); return; }
  const em = document.getElementById('cEmoji').value.trim() || '🍽️';
  const time = parseInt(document.getElementById('cTime').value) || 30;
  const tags = document.getElementById('cTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const ingLines = document.getElementById('cIngredients').value.split('\n').filter(l=>l.trim());
  const ingredients = ingLines.map(l => {
    const parts = l.split(';');
    return { em: '🥄', name: (parts[1]||parts[0]).trim(), amount: parts.length>1 ? parts[0].trim() : '' };
  });
  const steps = document.getElementById('cSteps').value.split('\n').filter(l=>l.trim());

  if (editingCustomId) {
    // Bearbeiten
    const idx = customRecipes.findIndex(x => x.id === editingCustomId);
    if (idx > -1) {
      customRecipes[idx] = { ...customRecipes[idx], name, em, time, tags: tags.length ? tags : ['Eigenes'], ingredients };
      if (steps.length > 0) prepCache[editingCustomId] = steps;
    }
    saveCustomToStorage();
    closeCustomRecipe();
    closeManageCustom();
    showToast(`"${name}" aktualisiert ✓`);
    renderPickerList();
    render();
  } else {
    // Neu erstellen
    const recipe = { id: nextCustomId++, name, em, time, tags: tags.length ? tags : ['Eigenes'], ingredients, custom: true };
    customRecipes.push(recipe);
    if (steps.length > 0) prepCache[recipe.id] = steps;
    saveCustomToStorage();
    closeCustomRecipe();
    showToast(`"${name}" hinzugefügt ✓`);
    renderPickerList();
  }
}

      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
